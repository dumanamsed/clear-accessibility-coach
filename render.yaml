# Render deployment blueprint — https://render.com
# Connect this repo at https://dashboard.render.com/blueprints and set
# ANTHROPIC_API_KEY in the service's Environment settings.
services:
  - type: web
    name: clear-accessibility-coach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 2 workers x 4 threads: the Claude AI call holds a thread for ~10s, so
    # threads keep one user's AI pass from blocking everyone else.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false      # set this secret in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.9"
